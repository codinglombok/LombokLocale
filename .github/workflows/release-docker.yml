# Staged release of the container image to GHCR (always) and Docker Hub
# (only when its secrets exist), run independently of the tag flow.
# dry_run=true (default) builds the image and smoke-tests it; a real push
# requires dry_run=false plus the matching tag input. The tag-driven
# release.yml remains the full-release path.
name: Release docker

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag this push belongs to (e.g. v0.2.0); required when dry_run=false"
        required: false
        default: ""
      dry_run:
        description: "true = build and smoke-test only; false = push the image"
        required: false
        default: "true"

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/codinglombok/lomboklocale
  DH_IMAGE: docker.io/codinglombok/lomboklocale

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: docker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect Docker Hub credentials (secrets are not readable in if:)
        id: dh
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "${DH_USER}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN absent; pushing to GHCR only"
          fi
      - name: Verify version against the tag input
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          V="$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)"
          echo "manifest version: ${V}"
          if [ -z "${TAG}" ]; then
            if [ "${DRY_RUN}" != "true" ]; then
              echo "refusing to push without the 'tag' input"; exit 1
            fi
            VER="${V}"
          else
            VER="${TAG#v}"
            if [ "v${V}" != "${TAG}" ]; then
              echo "tag input ${TAG} does not match manifest v${V}"; exit 1
            fi
          fi
          echo "VER=${VER}" >> "${GITHUB_ENV}"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: inputs.dry_run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub (skipped when the secrets are absent)
        if: inputs.dry_run != 'true' && steps.dh.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and smoke-test (dry run)
        if: inputs.dry_run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: VERSION=${{ env.VER }}
          tags: ${{ env.GHCR_IMAGE }}:dry-run
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the loaded image (must print "ok, lomboklocale ..." and exit 0)
        if: inputs.dry_run == 'true'
        run: docker run --rm "${GHCR_IMAGE}:dry-run"
      - name: Push to GHCR
        if: inputs.dry_run != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ env.VER }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.VER }}
            ${{ env.GHCR_IMAGE }}:v${{ env.VER }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push to Docker Hub (only when the secrets are present)
        if: inputs.dry_run != 'true' && steps.dh.outputs.available == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ env.VER }}
          tags: |
            ${{ env.DH_IMAGE }}:${{ env.VER }}
            ${{ env.DH_IMAGE }}:v${{ env.VER }}
            ${{ env.DH_IMAGE }}:latest
            ${{ env.DH_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
