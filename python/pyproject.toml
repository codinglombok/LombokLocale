[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lomboklocale"
version = "0.2.0"
description = "BCP 47 negotiation, CLDR 47 plural rules, number/currency/date formatting and an ICU MessageFormat subset with identical results in Python, Rust, TypeScript, Go and PHP. No dependencies."
readme = "README.md"
license = "(Apache-2.0 OR MIT) AND Unicode-3.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "LICENSE-UNICODE"]
authors = [{ name = "codinglombok" }]
requires-python = ">=3.9"
keywords = ["i18n", "l10n", "bcp47", "cldr", "plural", "messageformat", "number-format", "currency"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/codinglombok/LombokLocale"
Issues = "https://github.com/codinglombok/LombokLocale/issues"

[tool.setuptools]
packages = ["lomboklocale"]

[tool.setuptools.package-data]
lomboklocale = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
